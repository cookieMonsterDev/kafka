# https://pnpm.io/workspaces
packages:
  - packages/*

# Single source of truth for shared dependency versions.
# Packages reference these with "typescript": "catalog:".
catalog:
  typescript: ^7.0.2
  astro: ^7.4.7
  vite: ^8.3.6
  vitest: ^5.1.0
  '@vitest/coverage-v8': ^5.1.0
  '@types/node': ^26.6.6

# Astro's current checker requires TypeScript 6; runtime packages retain the main catalog.
catalogs:
  docs-check:
    typescript: ^6.0.0

# Link local packages into node_modules instead of fetching them from the registry.
linkWorkspacePackages: true
# Write `workspace:^` when adding a local package as a dependency.
saveWorkspaceProtocol: rolling
# Fail the install if workspace packages form a dependency cycle.
disallowWorkspaceCycles: true
# Enforce the `engines` field in package.json instead of only warning.
engineStrict: true
# Skip versions published less than a day ago (minutes). Setting this
# explicitly also turns on minimumReleaseAgeStrict, so install fails
# instead of falling back to a too-new release.
minimumReleaseAge: 1440
# astro2tsx omits its runtime dependency; match its pinned @emnapi/core until upstream fixes it.
packageExtensions:
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': 1.11.3
# esbuild ships a platform-specific binary and needs its install script to run.
allowBuilds:
  protobufjs: false
  esbuild: true
# Reviewed exceptions for `pnpm audit` in the Security workflow (.github/workflows/security.yml).
# Keep in sync with osv-scanner.toml, which holds each entry's reason and expiry date.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-rj75-hqrm-r3gf
    - GHSA-g3hv-75wg-m249
    - GHSA-gcqx-w48m-w2h4
