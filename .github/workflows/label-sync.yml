name: Label sync

on:
  push:
    branches: [master]
    paths:
      - '.github/labels.yml'
      - '.github/workflows/label-sync.yml'
  workflow_dispatch:

concurrency:
  group: label-sync
  cancel-in-progress: true

permissions:
  issues: write

jobs:
  sync:
    name: Sync repo labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: crazy-max/ghaction-github-labeler@v6
        with:
          yaml-file: .github/labels.yml
          skip-delete: false
