# A single-node KRaft Kafka broker, PLAINTEXT only, for trying the studio against a real cluster
# on a laptop. Not used by this package's own tests (those stay broker-free per the unit-test
# rule, and the eventual integration suite version-gates against the fixtures in
# @cookiemonsterdev/kafka-core's test/assets instead) — this file exists purely for the
# "Local Kafka with Docker" section of README.md.

name: kafka-studio-dev

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka-studio-dev
    ports:
      - '9092:9092'
    environment:
      CLUSTER_ID: kafka-studio-dev-cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29091,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29091
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test:
        ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s
