name: Detect release packages
description: >
  Resolves which workspace packages should release: from dorny/paths-filter for an automatic
  trigger, or from an explicit workflow_dispatch `package` choice — gated on the package actually
  existing on disk, since a manual dispatch bypasses paths-filter entirely. Assumes the caller has
  already checked out the repo with fetch-depth: 0.

inputs:
  packages:
    description: Space-separated package names, matching the top-level keys in `filters`
    required: true
  filters:
    description: dorny/paths-filter filter rules (YAML), one top-level key per package name
    required: true
  dispatch_package:
    description: The resolved workflow_dispatch `package` choice ('auto' when not applicable)
    required: true

outputs:
  flags:
    description: JSON object mapping each package name to a boolean, e.g. {"core":true,"cli":false}
    value: ${{ steps.flags.outputs.flags }}

runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@v4
      id: filter
      if: github.event_name == 'push' || inputs.dispatch_package == 'auto'
      with:
        base: ${{ github.ref }}
        filters: ${{ inputs.filters }}
    - id: flags
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        PACKAGES: ${{ inputs.packages }}
        DISPATCH_PACKAGE: ${{ inputs.dispatch_package }}
        CHANGES: ${{ steps.filter.outputs.changes }}
      run: |
        set -euo pipefail
        result='{}'
        for name in $PACKAGES; do
          value=false
          if [[ "$EVENT" == "workflow_dispatch" && "$DISPATCH_PACKAGE" != "auto" ]]; then
            # paths-filter didn't run, so a manually chosen package that doesn't exist yet
            # (e.g. a new package's own scaffolding PR hasn't merged) must be gated here too.
            [[ ( "$DISPATCH_PACKAGE" == "$name" || "$DISPATCH_PACKAGE" == "all" ) && -f "packages/$name/package.json" ]] && value=true
          elif [[ -n "${CHANGES:-}" ]] && jq -e --arg n "$name" 'index($n) != null' <<<"$CHANGES" >/dev/null; then
            value=true
          fi
          result=$(jq -c --arg k "$name" --argjson v "$value" '. + {($k): $v}' <<<"$result")
        done
        echo "flags=$result" >> "$GITHUB_OUTPUT"
