version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    labels:
      - dependencies
    groups:
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development

  # Competitor clients for benchmarks/. A bump is the signal to re-run and re-publish the results.
  - package-ecosystem: npm
    directory: /benchmarks
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      benchmark-clients:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'
