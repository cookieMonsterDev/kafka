# Chained semantic-release on master, walking RELEASE_PACKAGES in order. workflow_dispatch can
# force a package or dry-run.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        # GitHub requires choice options as literal YAML, so this list can't be generated from
        # RELEASE_PACKAGES — keep it in sync by hand (scripts/resolve-release-package.mjs is the
        # source of truth for order).
        type: choice
        options: [auto, config, core, cli, docs, all]
        default: auto
      dry_run:
        description: Analyze the next version without publishing, tagging, or opening a sync PR
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  changes:
    name: Detect packages
    runs-on: ubuntu-latest
    outputs:
      flags: ${{ steps.detect.outputs.flags }}
      any: ${{ steps.any.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - id: manifest
        name: Derive the package list and filters from RELEASE_PACKAGES
        run: node scripts/print-release-manifest-outputs.mjs
      - uses: ./.github/actions/detect-release-packages
        id: detect
        with:
          packages: ${{ steps.manifest.outputs.packages }}
          filters: ${{ steps.manifest.outputs.filters }}
          dispatch_package: ${{ inputs.package || 'auto' }}
      - id: any
        name: Any package changed?
        env:
          FLAGS: ${{ steps.detect.outputs.flags }}
        run: |
          set -euo pipefail
          if jq -e 'any(.[]; . == true)' <<<"$FLAGS" >/dev/null; then
            echo 'any=true' >> "$GITHUB_OUTPUT"
          else
            echo 'any=false' >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: [changes]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Set even when the chain step fails partway through, so sync-develop still runs after a
      # package released successfully before a later one failed.
      released: ${{ steps.chain.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/require-npm-oidc
      # bash ships on every GitHub-hosted Ubuntu runner; zsh doesn't. release-chain.mjs runs each
      # publishable package's own test script before releasing it, and the CLI's shell-completion
      # suite spawns zsh to verify what it actually generates — see
      # packages/cli/src/completion/scripts.test.ts (same as ci.yml's "Install zsh" step).
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run the release chain
        id: chain
        env:
          RELEASE_CHANGES: ${{ needs.changes.outputs.flags }}
          GITHUB_TOKEN: ${{ github.token }}
          HUSKY: '0'
        run: node scripts/release-chain.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

  sync-develop:
    name: Sync versions to develop
    needs: [release]
    if: >-
      always() &&
      inputs.dry_run != true &&
      needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Open PR from master into develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin master develop
          if git merge-base --is-ancestor origin/master origin/develop; then
            echo "develop already contains master; no sync PR"
            exit 0
          fi
          if gh pr list --base develop --head master --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create \
              --base develop \
              --head master \
              --title "chore: sync release versions into develop" \
              --body "$(cat <<'EOF'
          ## Summary

          Back-merge `master` into `develop` so `package.json` and `CHANGELOG.md`
          match the versions just released.

          - Created by the [Release](../actions/workflows/release.yml) workflow
          - Safe to merge with a merge commit (do not squash: keep release commits)

          EOF
          )"
          else
            echo "A master → develop PR is already open"
          fi
