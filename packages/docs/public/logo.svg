<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="kafka">
  <defs>
    <radialGradient id="disc" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#0c4448"/>
      <stop offset="45%" stop-color="#062b2e"/>
      <stop offset="100%" stop-color="#021314"/>
    </radialGradient>
    <linearGradient id="k-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8f7f2"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="teal-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="disc-clip">
      <circle cx="512" cy="509" r="415"/>
    </clipPath>
  </defs>

  <circle cx="512" cy="509" r="415" fill="url(#disc)"/>

  <g clip-path="url(#disc-clip)" fill="none" stroke-linecap="round">
    <g filter="url(#teal-glow)" stroke="#2ec9c0">
      <line x1="690" y1="208" x2="782" y2="208" stroke-width="3" opacity="0.55"/>
      <line x1="715" y1="236" x2="818" y2="236" stroke-width="2.5" opacity="0.5"/>
      <line x1="740" y1="262" x2="840" y2="262" stroke-width="2.5" opacity="0.45"/>
      <line x1="704" y1="310" x2="870" y2="310" stroke-width="4" opacity="0.7"/>
      <line x1="630" y1="368" x2="898" y2="368" stroke-width="9" opacity="0.95"/>
      <line x1="612" y1="410" x2="762" y2="410" stroke-width="5" opacity="0.85"/>
      <line x1="640" y1="440" x2="820" y2="440" stroke-width="6" opacity="0.9"/>
      <line x1="728" y1="554" x2="778" y2="554" stroke-width="3" opacity="0.5"/>
      <line x1="638" y1="598" x2="860" y2="598" stroke-width="9" opacity="0.95"/>
      <line x1="648" y1="640" x2="762" y2="640" stroke-width="5" opacity="0.85"/>
      <line x1="640" y1="668" x2="820" y2="668" stroke-width="6" opacity="0.9"/>
      <circle cx="782" cy="208" r="3.5" fill="#2ec9c0" stroke="none" opacity="0.7"/>
      <circle cx="818" cy="236" r="3" fill="#2ec9c0" stroke="none" opacity="0.6"/>
      <circle cx="870" cy="310" r="4" fill="#3ad4cb" stroke="none" opacity="0.8"/>
      <circle cx="898" cy="368" r="5" fill="#7eefe8" stroke="none"/>
      <circle cx="762" cy="410" r="4" fill="#5ee6de" stroke="none"/>
      <circle cx="820" cy="440" r="4.5" fill="#7eefe8" stroke="none"/>
      <circle cx="778" cy="554" r="3" fill="#2ec9c0" stroke="none" opacity="0.6"/>
      <circle cx="860" cy="598" r="5" fill="#7eefe8" stroke="none"/>
      <circle cx="762" cy="640" r="4" fill="#5ee6de" stroke="none"/>
      <circle cx="820" cy="668" r="4.5" fill="#7eefe8" stroke="none"/>
    </g>
  </g>

  <g filter="url(#glow)" fill="none" stroke="url(#k-stroke)" stroke-width="36" stroke-linecap="round">
    <line x1="367" y1="283" x2="363" y2="735"/>
    <line x1="363" y1="515" x2="568" y2="396"/>
    <line x1="363" y1="515" x2="570" y2="626"/>
  </g>

  <g filter="url(#glow)" fill="#062b2e" stroke="url(#k-stroke)" stroke-width="24">
