name: Exchange npm OIDC token
description: >
  Exchanges a short-lived npm OIDC publish token for one package, skipped on a dry run since
  nothing will be published. Call this as late as possible before the actual publish (semantic-
  release) — the exchanged token is short-lived, so it shouldn't sit idle through a build/test step.

inputs:
  npm_package:
    description: Full scoped npm package name, e.g. @cookiemonsterdev/kafka-core
    required: true
  dry_run:
    description: "'true' to skip the exchange"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Exchange npm OIDC token
      if: inputs.dry_run != 'true'
      shell: bash
      env:
        NPM_PACKAGE: ${{ inputs.npm_package }}
      run: node scripts/exchange-npm-oidc-token.mjs "$NPM_PACKAGE"
