# Unit tests never start Docker. Integration jobs select a compose file via
# KAFKA_VERSION (see packages/core/test/assets/README.md).
#
# PRs run the expensive ends plus one middle ZooKeeper and one middle KRaft
# stack (0.10, 2.4, 3.6, 4.0, 4.3). Pushes to `develop` (default) or `master`,
# and manual workflow_dispatch runs, cover the full matrix. The core integration
# job's Bun legs run a fixed 2.4, 3.6, 4.3 subset on every event.
name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_RETRIES: '2'

jobs:
  unit:
    name: Lint and unit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every supported Node major runs the build and unit tests. Runtime-independent checks
    # (formatting, commit messages, typecheck, generated files) run once, on the `primary` leg.
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
        include:
          - node: '26'
            primary: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.primary
        run: pnpm format:check
      - name: Lint commit messages
        if: matrix.primary && github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }} --verbose
      - name: Lint last commit message
        if: matrix.primary && github.event_name != 'pull_request'
        run: pnpm exec commitlint --last --verbose
      # core resolves `@cookiemonsterdev/kafka-config` through its published `exports` (dist), and
      # cli resolves `@cookiemonsterdev/kafka-core` the same way, so both tsc and vitest's module
      # resolution need each dist built before either runs — config first, since core depends on
      # it in turn. Studio bundles the CLI's embedded entry point, so CLI must build before Studio.
      - run: pnpm --filter @cookiemonsterdev/kafka-config build
      - run: pnpm --filter @cookiemonsterdev/kafka-core build
      - run: pnpm --filter @cookiemonsterdev/kafka-cli build
      - run: pnpm --filter @cookiemonsterdev/kafka-studio build
      - if: matrix.primary
        run: pnpm typecheck
      # bash ships on every GitHub-hosted Ubuntu runner; zsh doesn't. The CLI's shell-completion
      # suite spawns both to verify what it actually generates, not just its syntax — see
      # packages/cli/src/completion/scripts.test.ts.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: pnpm test
      # Loads every built dist the way a consumer would, on this leg's Node; the bun job below runs
      # the same script on Bun.
      - run: node scripts/bun-smoke.mjs
      - if: matrix.primary
        run: node scripts/check-publishable-deps.mjs
      - if: matrix.primary
        run: pnpm docs:generate:cli:check
      - if: matrix.primary
        run: pnpm theme:check
      - if: matrix.primary
        run: pnpm skills:validate

  bun:
    name: Unit (Bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The oldest minor `engines.bun` admits (>=1.4.0), at its newest patch, and the latest release.
    # setup-bun matches ranges with compare-versions, where a bare '1.4' means exactly 1.4.0, not
    # the newest 1.4.
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.4.x', 'latest']
    # Node still installs dependencies and builds every dist; Bun then runs each package's unit
    # suite (`test:bun`) and scripts/bun-smoke.mjs against the built output. The integration jobs'
    # Bun legs cover real brokers.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      # Same dependency build order as the unit job above.
      - run: pnpm --filter @cookiemonsterdev/kafka-config build
      - run: pnpm --filter @cookiemonsterdev/kafka-core build
      - run: pnpm --filter @cookiemonsterdev/kafka-cli build
      - run: pnpm --filter @cookiemonsterdev/kafka-studio build
      # The CLI's shell-completion suite spawns zsh, same as in the unit job.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: pnpm test:bun
      - run: bun scripts/bun-smoke.mjs

  integration-matrix:
    name: Integration matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - id: set
        env:
          FULL_MATRIX: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
        run: |
          if [[ "${FULL_MATRIX}" == "true" ]]; then
            echo 'versions=["0.10","0.11","1.1","2.4","3.6","4.0","4.1","4.2","4.3"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["0.10","2.4","3.6","4.0","4.3"]' >> "$GITHUB_OUTPUT"
          fi

  integration:
    name: Integration (Kafka ${{ matrix.kafka-version }}${{ matrix.bun && format(' / Bun {0}', matrix.bun) || '' }})
    needs: [unit, integration-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kafka-version: ${{ fromJSON(needs.integration-matrix.outputs.versions) }}
        # '' runs on Node.js. The Bun legs cover one ZooKeeper and two KRaft stacks on the oldest Bun
        # minor `engines.bun` admits and on the latest release (see the `bun` job for '1.4.x').
        bun: ['']
        include:
          - { kafka-version: '2.4', bun: '1.4.x' }
          - { kafka-version: '2.4', bun: latest }
          - { kafka-version: '3.6', bun: '1.4.x' }
          - { kafka-version: '3.6', bun: latest }
          - { kafka-version: '4.3', bun: '1.4.x' }
          - { kafka-version: '4.3', bun: latest }
    env:
      KAFKA_VERSION: ${{ matrix.kafka-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - if: matrix.bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: ./.github/actions/kafka-docker-images
      # core resolves `@cookiemonsterdev/kafka-config` through its published `exports` (dist),
      # so vitest's module resolution needs that dist built before tests run.
      - run: pnpm --filter @cookiemonsterdev/kafka-config build
      - run: pnpm --filter @cookiemonsterdev/kafka-core ${{ matrix.bun && 'test:bun:integration' || 'test:integration' }}

  cli-integration:
    name: Integration (CLI / Kafka 4.3${{ matrix.bun && format(' / Bun {0}', matrix.bun) || '' }})
    needs: [unit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 4.3 rather than the CLI's other supported version (4.0): share group commands (KIP-932)
    # need a broker at least at 4.1, and this is the one leg that exercises them.
    strategy:
      fail-fast: false
      matrix:
        # '' runs on Node.js; the same Bun versions as the core integration job.
        bun: ['', '1.4.x', 'latest']
    env:
      KAFKA_VERSION: '4.3'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - if: matrix.bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: ./.github/actions/kafka-docker-images
      # cli resolves both `@cookiemonsterdev/kafka-config` and `@cookiemonsterdev/kafka-core`
      # through their published `exports` (dist), so vitest's module resolution needs both built
      # before tests run — config first, since core depends on it in turn.
      - run: pnpm --filter @cookiemonsterdev/kafka-config build
      - run: pnpm --filter @cookiemonsterdev/kafka-core build
      - run: pnpm --filter @cookiemonsterdev/kafka-cli ${{ matrix.bun && 'test:bun:integration' || 'test:integration' }}

  studio-integration:
    name: Integration (Studio / Kafka 4.3${{ matrix.bun && format(' / Bun {0}', matrix.bun) || '' }})
    needs: [unit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same reasoning as the CLI leg above: the one version this suite pins itself against.
    strategy:
      fail-fast: false
      matrix:
        # '' runs on Node.js; the same Bun versions as the core integration job.
        bun: ['', '1.4.x', 'latest']
    env:
      KAFKA_VERSION: '4.3'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - if: matrix.bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: ./.github/actions/kafka-docker-images
      # studio resolves both `@cookiemonsterdev/kafka-config` and `@cookiemonsterdev/kafka-core`
      # through their published `exports` (dist), so vitest's module resolution needs both built
      # before tests run — config first, since core depends on it in turn.
      - run: pnpm --filter @cookiemonsterdev/kafka-config build
      - run: pnpm --filter @cookiemonsterdev/kafka-core build
      - run: pnpm --filter @cookiemonsterdev/kafka-cli build
      - run: pnpm --filter @cookiemonsterdev/kafka-studio ${{ matrix.bun && 'test:bun:integration' || 'test:integration' }}

  oauthbearer:
    name: Integration (OAUTHBEARER / 4.0)
    needs: [unit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAFKA_VERSION: '4.0'
      OAUTHBEARER_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/kafka-docker-images
      # core resolves `@cookiemonsterdev/kafka-config` through its published `exports` (dist),
      # so vitest's module resolution needs that dist built before tests run.
      - run: pnpm --filter @cookiemonsterdev/kafka-config build
      - run: pnpm --filter @cookiemonsterdev/kafka-core test:integration

  docs:
    name: Documentation accessibility and links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build with the GitHub Pages base
        env:
          GITHUB_PAGES: '1'
        run: pnpm --filter @cookiemonsterdev/kafka-docs... build
      - run: pnpm docs:check
      - run: pnpm --filter @cookiemonsterdev/kafka-docs exec playwright install --with-deps chromium
      - run: pnpm --filter @cookiemonsterdev/kafka-docs test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: docs-browser-results
          path: packages/docs/test-results/

  binaries:
    name: Standalone binaries (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The release workflow compiles `kafka` and `kafka-studio` for every target; this host build
    # catches a change that breaks them (an asset or worker the executable cannot find) earlier.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: pnpm --filter "@cookiemonsterdev/kafka-studio..." build
      - run: node scripts/build-binaries.mjs cli
      - run: node scripts/build-binaries.mjs studio
      - run: node scripts/smoke-binaries.mjs cli dist/binaries
      - run: node scripts/smoke-binaries.mjs studio dist/binaries
