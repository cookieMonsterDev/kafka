name: Feature request
description: Propose a new capability or a change in behavior
title: '[feat]: '
labels: [enhancement]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Open an issue before a large or breaking change so we can agree on the shape. See the [contributing guide](https://github.com/cookieMonsterDev/kafka/blob/master/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Who does it affect?
      placeholder: As a developer using @kafka/core, I want … so that …
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: API sketch, protocol key, or KIP if this tracks Apache Kafka. A PR is welcome after this issue is discussed.
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - '@kafka/core'
        - '@kafka/docs'
        - workspace / tooling
        - unsure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other APIs, existing workarounds, or reasons not to do this.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, prior art (KafkaJS, Java client, librdkafka), or screenshots.
  - type: checkboxes
    id: validations
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I read the [contributing guide](https://github.com/cookieMonsterDev/kafka/blob/master/CONTRIBUTING.md).
          required: true
        - label: I understand breaking changes need agreement on an issue before a PR.
          required: true
