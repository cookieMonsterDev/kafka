name: Setup Node.js and pnpm
description: Install Node (26 unless overridden), pnpm from packageManager, and workspace dependencies

inputs:
  node-version:
    description: Node.js major version to install
    required: false
    default: '26'

runs:
  using: composite
  steps:
    - uses: pnpm/setup@v2
      with:
        runtime: node@${{ inputs.node-version }}
        cache: true
        install: false
    - run: pnpm install --frozen-lockfile
      shell: bash
