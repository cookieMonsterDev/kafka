# Unit tests never start Docker. Integration jobs select a compose file via
# KAFKA_VERSION (see packages/core/test/assets/README.md).
#
# PRs run the expensive ends plus one middle ZooKeeper and one middle KRaft
# stack (0.10, 2.4, 3.6, 4.0, 4.3). Pushes to `develop` (default) or `master`,
# and manual workflow_dispatch runs, cover the full matrix.
name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_RETRIES: '2'

jobs:
  unit:
    name: Lint and unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm format:check
      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }} --verbose
      - name: Lint last commit message
        if: github.event_name != 'pull_request'
        run: pnpm exec commitlint --last --verbose
      # core resolves `@cookiemonsterdev/kafka-config` through its published `exports` (dist), and
      # cli resolves `@cookiemonsterdev/kafka-core` the same way, so both tsc and vitest's module
      # resolution need each dist built before either runs — config first, since core depends on
      # it in turn.
      - run: pnpm --filter @cookiemonsterdev/kafka-config build
      - run: pnpm --filter @cookiemonsterdev/kafka-core build
      # docs is excluded: `astro check` (packages/docs's typecheck script) fails under the
      # TypeScript 7.0.2 catalog pin — it dropped the programmatic API astro-language-server
      # needs (https://github.com/withastro/roadmap/discussions/1321). Pre-existing, tracked
      # as a follow-up; `pnpm typecheck` from the repo root still runs it for local dev.
      - run: pnpm --filter '!@cookiemonsterdev/kafka-docs' typecheck
      - run: pnpm test
      - run: node scripts/check-publishable-deps.mjs

  integration-matrix:
    name: Integration matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - id: set
        env:
          FULL_MATRIX: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
        run: |
          if [[ "${FULL_MATRIX}" == "true" ]]; then
            echo 'versions=["0.10","0.11","1.1","2.4","3.6","4.0","4.1","4.2","4.3"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["0.10","2.4","3.6","4.0","4.3"]' >> "$GITHUB_OUTPUT"
          fi

  integration:
    name: Integration (Kafka ${{ matrix.kafka-version }})
    needs: [unit, integration-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kafka-version: ${{ fromJSON(needs.integration-matrix.outputs.versions) }}
    env:
      KAFKA_VERSION: ${{ matrix.kafka-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: Restore Kafka Docker images
        id: docker-cache
        uses: actions/cache@v6
        with:
          path: /tmp/kafka-docker-images.tar
          key: kafka-docker-${{ matrix.kafka-version }}-${{ hashFiles('packages/core/test/assets/**/*.yml', 'packages/core/scripts/format-and-start.sh') }}
          restore-keys: |
            kafka-docker-${{ matrix.kafka-version }}-
      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/kafka-docker-images.tar
      - name: Pull Docker images
        run: bash packages/core/scripts/compose-pull.sh
      - name: Save Docker images
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          images=$(docker compose -f "$(bash packages/core/scripts/resolve-compose-file.sh)" config --images)
          docker save ${images} -o /tmp/kafka-docker-images.tar
      # core resolves `@cookiemonsterdev/kafka-config` through its published `exports` (dist),
      # so vitest's module resolution needs that dist built before tests run.
      - run: pnpm --filter @cookiemonsterdev/kafka-config build
      - run: pnpm --filter @cookiemonsterdev/kafka-core test:integration

  oauthbearer:
    name: Integration (OAUTHBEARER / 4.0)
    needs: [unit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAFKA_VERSION: '4.0'
      OAUTHBEARER_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - name: Restore Kafka Docker images
        id: docker-cache
        uses: actions/cache@v6
        with:
          path: /tmp/kafka-docker-images.tar
          key: kafka-docker-oauthbearer-4.0-${{ hashFiles('packages/core/test/assets/docker-compose.kraft-oauthbearer.yml', 'packages/core/scripts/format-and-start.sh') }}
          restore-keys: |
            kafka-docker-oauthbearer-4.0-
      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/kafka-docker-images.tar
      - name: Pull Docker images
        run: bash packages/core/scripts/compose-pull.sh
      - name: Save Docker images
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          images=$(docker compose -f "$(bash packages/core/scripts/resolve-compose-file.sh)" config --images)
          docker save ${images} -o /tmp/kafka-docker-images.tar
      # core resolves `@cookiemonsterdev/kafka-config` through its published `exports` (dist),
      # so vitest's module resolution needs that dist built before tests run.
      - run: pnpm --filter @cookiemonsterdev/kafka-config build
      - run: pnpm --filter @cookiemonsterdev/kafka-core test:integration
