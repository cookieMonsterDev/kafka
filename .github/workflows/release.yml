# Chained semantic-release on master, walking RELEASE_PACKAGES in order. workflow_dispatch can
# force a package or dry-run. After npm publishing, the binaries-* jobs attach standalone `kafka`
# and `kafka-studio` executables to the cli and studio GitHub releases this run created.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        # GitHub requires choice options as literal YAML, so this list can't be generated from
        # RELEASE_PACKAGES — keep it in sync by hand (scripts/resolve-release-package.mjs is the
        # source of truth for order).
        type: choice
        options: [auto, config, core, cli, studio, docs, all]
        default: auto
      dry_run:
        description: Analyze the next version without publishing, tagging, or opening a sync PR
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect packages
    runs-on: ubuntu-latest
    outputs:
      flags: ${{ steps.detect.outputs.flags }}
      any: ${{ steps.any.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - id: manifest
        name: Derive the package list and filters from RELEASE_PACKAGES
        run: node scripts/print-release-manifest-outputs.mjs
      - uses: ./.github/actions/detect-release-packages
        id: detect
        with:
          packages: ${{ steps.manifest.outputs.packages }}
          filters: ${{ steps.manifest.outputs.filters }}
          dispatch_package: ${{ inputs.package || 'auto' }}
      - id: any
        name: Any package changed?
        env:
          FLAGS: ${{ steps.detect.outputs.flags }}
        run: |
          set -euo pipefail
          if jq -e 'any(.[]; . == true)' <<<"$FLAGS" >/dev/null; then
            echo 'any=true' >> "$GITHUB_OUTPUT"
          else
            echo 'any=false' >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: [changes]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      # Set even when the chain step fails partway through, so sync-develop still runs after a
      # package released successfully before a later one failed.
      released: ${{ steps.chain.outputs.released }}
    steps:
      # Keep RELEASE_TOKEN out of the persisted git config, where every install script and test
      # could read it; release-chain.mjs hands it and GITHUB_TOKEN only to semantic-release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/require-npm-oidc
      # bash ships on every GitHub-hosted Ubuntu runner; zsh doesn't. release-chain.mjs runs each
      # publishable package's own test script before releasing it, and the CLI's shell-completion
      # suite spawns zsh to verify what it actually generates — see
      # packages/cli/src/completion/scripts.test.ts (same as ci.yml's "Install zsh" step).
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run the release chain
        id: chain
        env:
          RELEASE_CHANGES: ${{ needs.changes.outputs.flags }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          HUSKY: '0'
        run: node scripts/release-chain.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

  sync-develop:
    name: Sync versions to develop
    needs: [release]
    if: >-
      always() &&
      inputs.dry_run != true &&
      needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Open PR from master into develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin master develop
          if git merge-base --is-ancestor origin/master origin/develop; then
            echo "develop already contains master; no sync PR"
            exit 0
          fi
          if gh pr list --base develop --head master --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create \
              --base develop \
              --head master \
              --title "chore: sync release versions into develop" \
              --body "$(cat <<'EOF'
          ## Summary

          Back-merge `master` into `develop` so `package.json` and `CHANGELOG.md`
          match the versions just released.

          - Created by the [Release](../actions/workflows/release.yml) workflow
          - Safe to merge with a merge commit (do not squash: keep release commits)

          EOF
          )"
          else
            echo "A master → develop PR is already open"
          fi

  # Finds the cli/studio releases this run tagged that have no binaries attached yet. A tag that
  # does not descend from this run's commit belongs to an earlier run; re-run a failed binaries job
  # from that earlier run instead.
  binaries-plan:
    name: Plan binaries
    needs: [release]
    if: >-
      always() &&
      inputs.dry_run != true &&
      needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        name: List releases that need binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags origin master
          releases='[]'
          for package in cli studio; do
            version=$(git show "origin/master:packages/${package}/package.json" | jq -r .version)
            tag="${package}-v${version}"
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null ||
              ! git merge-base --is-ancestor "$GITHUB_SHA" "$tag"; then
              continue
            fi
            if [[ "$(gh release view "$tag" --json assets --jq '.assets | length')" != '0' ]]; then
              continue
            fi
            releases=$(jq -c --arg package "$package" --arg tag "$tag" '. + [{package: $package, tag: $tag}]' <<<"$releases")
          done
          echo "releases=${releases}" >> "$GITHUB_OUTPUT"

  # Cross-compiles every target from the released tag; binaries-smoke runs each on its own platform.
  binaries-build:
    name: Build ${{ matrix.release.package }} binaries
    needs: [binaries-plan]
    # `!cancelled()` plus each direct parent's result, here and below: the implicit `success()` also
    # looks at `release`, which fails when a later package fails after cli or studio was published.
    if: >-
      !cancelled() &&
      needs.binaries-plan.result == 'success' &&
      needs.binaries-plan.outputs.releases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        release: ${{ fromJSON(needs.binaries-plan.outputs.releases) }}
    env:
      PACKAGE: ${{ matrix.release.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.release.tag }}
      - uses: ./.github/actions/setup-node-pnpm
      # The executables embed this Bun; the same version CI's binaries job builds and tests with.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: pnpm --filter "@cookiemonsterdev/kafka-${PACKAGE}..." build
      - run: node scripts/build-binaries.mjs "$PACKAGE" --target all --outdir binaries
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.release.package }}
          path: binaries/
          if-no-files-found: error

  binaries-smoke:
    name: Smoke ${{ matrix.release.package }} on ${{ matrix.platform.target }}
    needs: [binaries-plan, binaries-build]
    if: ${{ !cancelled() && needs.binaries-build.result == 'success' }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.binaries-plan.outputs.releases) }}
        # Every target in scripts/build-binaries.mjs's BINARY_TARGETS, on a runner that can run it.
        platform:
          - { runner: ubuntu-latest, target: bun-linux-x64 }
          - { runner: ubuntu-24.04-arm, target: bun-linux-arm64 }
          - { runner: macos-latest, target: bun-darwin-arm64 }
          - { runner: windows-latest, target: bun-windows-x64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.release.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/download-artifact@v8
        with:
          name: binaries-${{ matrix.release.package }}
          path: binaries
      - run: node scripts/smoke-binaries.mjs ${{ matrix.release.package }} binaries

  binaries-publish:
    name: Attach ${{ matrix.release.package }} binaries
    needs: [binaries-plan, binaries-smoke]
    if: ${{ !cancelled() && needs.binaries-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      matrix:
        release: ${{ fromJSON(needs.binaries-plan.outputs.releases) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries-${{ matrix.release.package }}
          path: binaries
      - name: Upload the binaries and their checksums to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.release.tag }}
        run: gh release upload "$TAG" binaries/* --repo "$GITHUB_REPOSITORY"
